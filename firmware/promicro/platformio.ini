[platformio]
default_envs = promicro_5v16mhz

[env]
platform = atmelavr
framework = arduino
lib_extra_dirs = ../../shared
build_flags = -I../../shared/protocol
monitor_speed = 115200

; This is a common Pro Micro target, not a claim about the user's exact board.
; Select promicro_3v3_8mhz instead if the physical board is the 3.3 V / 8 MHz model.
[env:promicro_5v16mhz]
board = sparkfun_promicro16
build_flags = ${env.build_flags} -DKILN_PROMICRO_VOLTAGE_MV=5000 -DKILN_PROMICRO_CLOCK_HZ=16000000

[env:promicro_3v3_8mhz]
board = sparkfun_promicro8
build_flags = ${env.build_flags} -DKILN_PROMICRO_VOLTAGE_MV=3300 -DKILN_PROMICRO_CLOCK_HZ=8000000
