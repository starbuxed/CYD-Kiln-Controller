[platformio]
default_envs = cyd_28_ili9341_xpt2046

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I../../shared/protocol
; The Pro Micro link is retained as legacy source but excluded from the
; current CYD + ESP32-S3 controller build.
build_src_filter = +<main.cpp> +<controller_link.cpp>

[env:cyd_28_ili9341_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=1

[env:cyd_28_st7789_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=2

[env:cyd_28_ili9341_cst820]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=3

[env:cyd_24_family]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=7

[env:cyd_32_st7789]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=8

[env:cyd_35_st7796_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=4

[env:cyd_35_st7796_gt911]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=9

[env:cyd_43_s3_rgb_gt911]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=5

[env:cyd_70_s3_rgb_gt911]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=6

[env:custom_cyd]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=99
