[platformio]
default_envs = cyd_28_ili9341_xpt2046

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I../../shared -I../../shared/protocol
build_src_filter = +<main.cpp> +<controller_link.cpp> +<touch_ui.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

[env:cyd_28_ili9341_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=1 -DUSER_SETUP_LOADED=1 -DILI9341_DRIVER -DTFT_WIDTH=240 -DTFT_HEIGHT=320 -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1 -DSPI_FREQUENCY=40000000

[env:cyd_28_st7789_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=2

[env:cyd_28_ili9341_cst820]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=3

[env:cyd_24_family]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=7

[env:cyd_32_st7789]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=8

[env:cyd_35_st7796_xpt2046]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=4

[env:cyd_35_st7796_gt911]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=9

[env:cyd_43_s3_rgb_gt911]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=5

[env:cyd_70_s3_rgb_gt911]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=6

[env:custom_cyd]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=99

; Opt-in for a verified classic 2.8-inch CYD revision where GPIO16 is the
; active-low onboard green RGB LED channel. Requires a soldered tap and buffer.
[env:cyd_28_ili9341_xpt2046_gpio16permit]
board = esp32dev
build_flags = ${env.build_flags} -DKILN_BOARD_PROFILE=1 -DKILN_CYD_USE_GPIO16_GREEN_LED_FOR_MASTER_PERMIT=1 -DUSER_SETUP_LOADED=1 -DILI9341_DRIVER -DTFT_WIDTH=240 -DTFT_HEIGHT=320 -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1 -DSPI_FREQUENCY=40000000
