[platformio]
default_envs = controller_s3_devkitc1

[env:controller_s3_devkitc1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  adafruit/Adafruit MAX31856 library
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DKILN_S3_CAN_TX_PIN=-1
  -DKILN_S3_CAN_RX_PIN=-1
  -DKILN_S3_CAN_BITRATE=500000
  -DKILN_S3_SHUTDOWN_REQUEST_PIN=-1
  -I../../shared
  -I../../shared/protocol
