[platformio]
default_envs = controller_s3_devkitc1
test_dir = ../../tests

[env:controller_s3_devkitc1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -I../../shared/protocol

; Host-native tests compile only the portable control/sensor modules.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
  +<profile_engine.cpp>
  +<zone_controller.cpp>
  +<safety_manager.cpp>
  +<kiln_control_core.cpp>
  +<sensor_manager.cpp>
build_flags =
  -Isrc
  -I../../shared/protocol
